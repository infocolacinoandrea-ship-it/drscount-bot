name: Dr.Scount bot

on:
  schedule:
    - cron: "*/15 6-22 * * *"   # di scorta: riavvia il bot se la catena si interrompe
  workflow_dispatch: {}          # permette di lanciarlo a mano da GitHub

concurrency:
  group: drscount
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Configura git
        run: |
          git config user.name "drscount-bot"
          git config user.email "drscount-bot@users.noreply.github.com"

      - name: Giro del bot (resta in ascolto ~25 minuti)
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_CHANNEL: drscount
          LISTEN_MINUTES: "25"
          LOOKBACK_HOURS: "2"   # solo offerte pubblicate sul canale nelle ultime 2 ore
          MAX_PREVIEWS_PER_DAY: "20"   # post massimi al giorno
          AUTO_PUBLISH: "1"            # pubblica senza approvazione
          MIN_DISCOUNT: "0"            # nessun filtro: tutte le offerte del canale
          MIN_RATING: "0"
          MIN_REVIEWS: "0"
        run: python src/main.py

      - name: Salva stato e immagini
        if: always()
        run: |
          [ -f state.json ] && git add state.json
          [ -d posts ] && git add posts
          git diff --cached --quiet || (git commit -m "bot: aggiornamento" && git pull --rebase -X theirs && git push)

      - name: Rilancia il bot (dalle 7 alle 23)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          # se il giro è andato male aspetta 2 minuti prima di ripartire
          [ "$JOB_STATUS" != "success" ] && sleep 120
          H=$(TZ=Europe/Rome date +%-H)
          if [ "$H" -ge 7 ] && [ "$H" -lt 23 ]; then gh workflow run drscount.yml --ref main; fi
