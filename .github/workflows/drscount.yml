name: Dr.Scount bot

on:
  schedule:
    - cron: "*/15 6-22 * * *"   # ogni 15 minuti, dalle 7 alle 23 circa (ora italiana)
  workflow_dispatch: {}          # permette di lanciarlo a mano da GitHub

concurrency:
  group: drscount
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Giro del bot
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_ADMIN_CHAT_ID: ${{ secrets.TG_ADMIN_CHAT_ID }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          TG_CHANNEL: drscount
        run: python src/main.py

      - name: Salva stato e immagini
        if: always()
        run: |
          git config user.name "drscount-bot"
          git config user.email "drscount-bot@users.noreply.github.com"
          [ -f state.json ] && git add state.json
          [ -d posts ] && git add posts
          git diff --cached --quiet || (git commit -m "bot: aggiornamento" && git push)
